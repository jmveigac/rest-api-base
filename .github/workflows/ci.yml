name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore rest-api-base.sln
      - run: dotnet format rest-api-base.sln --verify-no-changes --no-restore
      - run: dotnet build rest-api-base.sln --configuration Release --no-restore --warnaserror

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore rest-api-base.sln
      - run: dotnet test --project tests/rest-api-base.Tests/rest-api-base.Tests.csproj --configuration Release --no-restore

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore rest-api-base.csproj
      - run: dotnet publish rest-api-base.csproj --configuration Release --no-restore --output ./publish
