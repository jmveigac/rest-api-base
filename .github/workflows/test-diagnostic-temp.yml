name: Test diagnostics

on:
  push:
    branches:
      - agent/refresh-dotnet10-template

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore rest-api-base.sln
      - name: Capture test diagnostics
        run: |
          dotnet test --project tests/rest-api-base.Tests/rest-api-base.Tests.csproj --configuration Release --no-restore --output Detailed > test-output.txt 2>&1 || true
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-output.txt
          git commit -m "Capture test diagnostics"
          git push
