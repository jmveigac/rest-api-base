name: Normalize format

on:
  push:
    branches:
      - agent/refresh-dotnet10-template

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore rest-api-base.sln
      - run: dotnet format rest-api-base.sln --no-restore
      - name: Commit normalized format
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize .NET formatting"
          git push
